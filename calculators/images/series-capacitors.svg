<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 260" role="img" aria-labelledby="title desc">
  <title id="title">Последовательное соединение двух конденсаторов</title>
  <desc id="desc">Конденсаторы C1 и C2 соединены последовательно в одной цепи.</desc>
  <rect width="640" height="260" rx="14" fill="#fff"/>
  <g fill="none" stroke="#263746" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M60 130 H200 M224 82 V178 M246 82 V178 M246 130 H394 M418 82 V178 M440 82 V178 M440 130 H580"/>
    <path d="M200 92 V168 M394 92 V168" stroke-width="2" opacity=".25"/>
  </g>
  <g fill="#263746" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" text-anchor="middle">
    <text x="223" y="60">C₁</text><text x="429" y="60">C₂</text>
    <text x="320" y="225" font-size="21" font-weight="400">Cобщ меньше каждого конденсатора</text>
  </g>
  <g fill="#3c7ca7"><circle cx="60" cy="130" r="6"/><circle cx="580" cy="130" r="6"/></g>
</svg>
