    <text x="145" y="62" font-size="14" font-weight="700">S</text>
    <text x="215" y="62" font-size="14" font-weight="700">S</text>
    <text x="341" y="165" font-size="17" font-weight="700">H</text>
    <text x="223" y="99" font-size="14" font-weight="700">T</text>
    <text x="180" y="164" font-size="18" font-weight="700">εr</text>
    <text x="180" y="266" font-size="15">Земля снизу + боковые земли</text>
  </g>
</svg>
