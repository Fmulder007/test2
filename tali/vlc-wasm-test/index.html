<!doctype html>
<html lang="ru" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f5f7">
  <title>TALI — тест VLC WebAssembly</title>
  <link rel="stylesheet" href="./style.css">
  <script type="module" src="./app.js?v=local-wasm-1"></script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/">TALI</a>
    <span class="page-label">Тест VLC WebAssembly</span>
  </header>

  <main class="page">
    <section class="panel">
      <h1>Проверка VLC WebAssembly</h1>
      <p class="muted">Отдельный эксперимент. Основной плеер TALI не затрагивается.</p>

      <div class="isolation" id="isolation">Проверка изоляции браузера…</div>

      <label for="mediaUrl">Адрес видеофайла</label>
      <input id="mediaUrl" type="text" spellcheck="false" placeholder="/video/папка/фильм.mkv">
      <button id="openButton" class="primary" type="button">Открыть в VLC</button>

      <div class="video-frame">
        <canvas id="videoCanvas"></canvas>
        <div id="overlay" class="overlay">Выберите видеофайл</div>
      </div>

      <div class="controls">
        <button id="playButton" type="button" disabled>▶</button>
        <span id="currentTime">0:00</span>
        <input id="seek" type="range" min="0" max="1" value="0" step="0.1" disabled>
        <span id="duration">0:00</span>
        <button id="stopButton" type="button" disabled>Стоп</button>
      </div>

      <div class="volume-row">
        <label for="volume">Звук</label>
        <input id="volume" type="range" min="0" max="1" value="1" step="0.01" disabled>
        <button id="fullscreenButton" type="button">На весь экран</button>
      </div>
      <pre id="log" class="log">Ожидание запуска.</pre>
    </section>
  </main>
</body>
</html>
