# Добавить ВНУТРИ server { ... } блока виртуального хоста TALI.
# Остальные location и настройки не менять.
#
# Заголовки выдаются только тестовой странице и её ресурсам.
location ^~ /vlc-wasm-test/ {
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;
    try_files $uri $uri/ =404;
}
