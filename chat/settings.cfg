dark_search_match_text_color = "#fff2bf"

# Строка состояния, статусы и элементы списка пользователей.
dark_statusbar_background = "#2e343b"
dark_status_text_color = "#d0d6de"
dark_success_color = "#91d6a0"
dark_error_color = "#ff9999"
dark_blocked_background = "#442d31"
dark_subtle_border_color = "#3e454d"
dark_online_color = "#72d58f"
dark_offline_color = "#a3acb8"
dark_danger_color = "#ff9999"
dark_status_success_color = "#91d6a0"
dark_status_info_color = "#d0d6de"
dark_tag_background = "#383f48"
dark_tag_border_color = "#515b66"
dark_message_time_color = "#aab3bf"
dark_journal_head_color = "#bac3ce"
dark_private_detail_color = "#aab4c0"
dark_attachment_background = "#303740"
dark_hover_background = "#3c4137"


# Фон активного пункта аккордеона в светлой теме.
