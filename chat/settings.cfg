# Фон активного пункта аккордеона в тёмной теме.
dark_accordion_active_background = "#3b4d60"

[smiles]
# Пути относительно корня /chat; сами каталоги и _define.ini не переименовывать.
light_dir = "assets/smiles/light"
dark_dir = "assets/smiles/dark"
# Количество смайликов в строке: 2 или 3.
columns = 3
# Максимальная ширина и высота отображения изображения в пикселях.
image_size_px = 32