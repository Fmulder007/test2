# Настройки самостоятельного чата.
# ВАЖНО: заполните параметры БД и почты перед запуском.
# Файл защищается Apache через .htaccess. Не публикуйте его содержимое.

[app]
# Полный URL каталога чата без завершающего слэша.
base_url = "https://hidden/chat"
# Именованный часовой пояс PHP, например Europe/Paris, Europe/Moscow.
timezone = "Europe/Paris"
# 1 = требовать HTTPS; 0 = разрешить также HTTP для доверенной локальной сети.
https_required = 1
# Интервал получения новых сообщений браузером, секунды.
poll_seconds = 2
# Интервал heartbeat присутствия, секунды; офлайн после presence_timeout_seconds.
presence_seconds = 30
presence_timeout_seconds = 90
# Имя cookie сессии.
session_name = "LIGHTCHATSESSID"
home_url = "https://hidden/"

[database]
host = "hidden"
port = 3306
name = "hidden"
user = "hidden"
password = "hidden"
charset = "utf8mb4"

[admins]
# Список email администраторов через запятую; регистр email не имеет значения.
emails = "admin@karat3.ru"

[mail]
# Допустимые значения: smtp или php_mail
method = "php_mail"
from_email = "admin@hidden"
from_name = "Web 1.0 Chat"
# SMTP используется только если method = "smtp".
smtp_host = "localhost"
smtp_port = 587
# Допустимые значения: starttls, ssl, none
smtp_encryption = "starttls"
smtp_username = ""
smtp_password = ""
smtp_timeout_seconds = 15

[communication]
protocol = 2

[limits]
# Антифлуд: интервал между сообщениями одного пользователя.
message_interval_seconds = 5
message_max_chars = 4000
# Максимальное число записей за один запрос истории.
history_page_size = 100
# Ограничения вложений.
attachment_max_bytes = 10485760
attachment_max_count = 10
attachments_per_message_max_bytes = 20971520
# Логическая квота: 1 ГиБ. Учитываются JSON содержимого и байты вложений.
storage_quota_bytes = 1073741824
storage_cleanup_start_percent = 90
storage_cleanup_target_percent = 80
# 0 = бессрочно; иначе автоматическое удаление журнала старше N дней.
audit_retention_days = 0
# Количество закреплённых сообщений в верхнем блоке.
pinned_count = 3
# Максимальная длина строки предпросмотра цитаты/закрепления; в строке добавляется многоточие.
quote_max_chars = 80
pinned_preview_max_chars = 100
# Регистрационные письма: не чаще одного раза за N секунд на email.
mail_resend_interval_seconds = 60
registration_token_hours = 24
password_reset_token_minutes = 30
nick_change_token_minutes = 30
# Ограничение частоты неудачных логинов на один IP/email в пределах окна.
login_attempts_limit = 10
login_attempts_window_minutes = 15
# Ограничение регистрации с одного IP в час.
registrations_per_ip_per_hour = 10

[files]
# Список расширений и соответствующих MIME-типа; оба должны совпасть с реальным файлом.
allowed_extensions = "jpg,jpeg,png,gif,webp,pdf,txt,zip"
allowed_mimes = "image/jpeg,image/png,image/gif,image/webp,application/pdf,text/plain,application/zip,application/x-zip-compressed"
# Соответствие расширений MIME-типам; для нового типа добавьте и расширение, и MIME-связку.
extension_mime_map = "jpg:image/jpeg,jpeg:image/jpeg,png:image/png,gif:image/gif,webp:image/webp,pdf:application/pdf,txt:text/plain,zip:application/zip|application/x-zip-compressed"
# Все вложения в первой версии представлены только ссылками на скачивание. Миниатюр нет.
thumbnail_max_side_px = 256

